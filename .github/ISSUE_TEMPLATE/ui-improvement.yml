name: UI or experience improvement
description: A design-contract, usability or accessibility problem. 设计约束、可用性或无障碍问题。
labels: [enhancement, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues first. Purely subjective taste belongs in the Idea template. 先搜索现有 issue;纯主观审美请用 Idea 模板。
  - type: dropdown
    id: kind
    attributes:
      label: What kind of problem / 问题类型
      options:
        - Violates docs/design/ui-guidelines.md
        - Usability (cannot find it, unclear state, missing feedback)
        - Accessibility (keyboard, focus, screen reader, contrast, reduced motion)
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: User goal / 用户目标
      description: One sentence in the Jira story form. 用 Jira 故事的句式写一句话。
      placeholder: "As a traveller using …, I want …, so that …."
    validations:
      required: true
  - type: textarea
    id: where
    attributes:
      label: Where and what it is now / 哪里、现在怎样
      description: Name the screen and the element. 写清页面和元素。
    validations:
      required: true
  - type: textarea
    id: rule
    attributes:
      label: What it violates / 违反了什么
      description: Quote the guideline or describe who is blocked. 引用设计约束,或说明谁会被卡住。
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested change / 建议怎样
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Device, browser and language / 设备、浏览器与语言
      placeholder: Pixel 8, Chrome 130, 简体中文
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshot / 截图
      description: Drag files here. 可直接拖入文件。
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria / 验收标准
      description: Checks that show it is fixed or built, one per line. 每行一条，可以验证是否完成。
      placeholder: |
        - At 390 px, … is visible without scrolling
        - A screen reader announces …
    validations:
      required: true
  - type: input
    id: jira
    attributes:
      label: Jira key / Jira 编号
      description: Leave blank. The maintainer adds the story key here and at the start of the title during triage. 留空，分诊时由维护者填写，并加到标题开头。
      placeholder: TP-
  - type: checkboxes
    id: ai
    attributes:
      label: Provenance / 来源
      options:
        - label: An AI tool found this first, and I checked it myself. 最初由 AI 发现,我已自己确认。
