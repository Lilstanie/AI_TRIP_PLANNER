name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Only files this change touched: the repository still holds unformatted files, so a
      # whole-repo check would fail on code nobody edited. Pull requests compare against the base
      # branch, pushes against the previous tip (all zeros on a new branch, which the script handles).
      - name: Prettier (changed files)
        run: node scripts/format-check-changed.mjs "$BASE"
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}

      # Browser journeys are selected by the CLI acceptance job; this also catches stale selectors.
      - run: pnpm verify:e2e-selectors
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm test:scripts
      - run: pnpm build

  cli-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y lsof
      - run: pnpm --filter @trip/web exec playwright install --with-deps chromium
      - name: Sequential CLI acceptance
        run: node apps/web/tests/cli-e2e/run.mjs
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Save CLI acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cli-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            output/e2e/
            output/playwright/
          if-no-files-found: warn
          retention-days: 7

  protected-files:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - run: node scripts/verify-protected-files.mjs origin/${{ github.base_ref }}

      - name: Branch name
        run: node scripts/verify-branch-name.mjs "$HEAD_REF"
        env:
          HEAD_REF: ${{ github.head_ref }}

      - run: node scripts/verify-docs.mjs

      - run: node .agents/skills/translate-docs/scripts/check-pairs.mjs
