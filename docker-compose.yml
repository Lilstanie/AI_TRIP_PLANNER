services:
  web:
    build:
      context: .
      target: dev
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    environment:
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - mock-apis

  mock-apis:
    build:
      context: .
      target: dev
    command: pnpm --filter @trip/tools mock-server
    ports:
      - "4000:4000"
    volumes:
      - .:/app
      - /app/node_modules

  # Durable state uses an Upstash-compatible Redis REST API (KV_REST_API_URL and
  # KV_REST_API_TOKEN in .env.local), not the Redis wire protocol, so a plain
  # redis image cannot back it. Without those variables state stays in memory.
